[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service and workers for resume-engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "resume-engine",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic-settings>=2.11",
    "psycopg[binary]>=3.2",
    "redis>=6.4",
    "boto3>=1.40",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
