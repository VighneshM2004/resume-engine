# Local development stack. One command: `make up` (or `docker compose up -d --wait`).
# Image tags are pinned to exact versions (ADR-010, ADR-011); bump deliberately.
# Published ports bind to 127.0.0.1 only, so nothing is exposed to your LAN.

name: resume-engine

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/,
      # so the volume mounts the parent directory.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    # SeaweedFS replaces MinIO, whose community images are discontinued (ADR-010).
    # Single-container mode: master + volume + filer + S3 gateway.
    image: chrislusf/seaweedfs:4.28
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
