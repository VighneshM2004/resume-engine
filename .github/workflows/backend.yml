name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked --all-packages

      - name: ruff (lint + format)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: unit tests (coverage gate 70%)
        run: make test

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: docker build + integration tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # CI uses the documented local-dev values; nothing secret here.
      - run: cp .env.example .env

      - name: build images and start the stack
        run: make up

      - run: uv sync --locked --all-packages

      - name: integration tests
        run: make test-integration

      - name: service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: tear down
        if: always()
        run: docker compose down -v
