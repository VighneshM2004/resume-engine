name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new CVEs appear in dependencies that haven't changed.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: pip-audit (Python CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
      # Audit exactly what the lock file pins (runtime deps, all packages).
      - run: uv export --frozen --no-dev --all-packages --no-emit-workspace --no-hashes -o requirements-audit.txt
      - run: uvx pip-audit --strict --requirement requirements-audit.txt
