name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze, format, widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # The workflow file can change before the Flutter project exists (M0).
      # Skip cleanly instead of failing on a missing directory.
      - name: detect Flutter project
        id: detect
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No app/pubspec.yaml yet: Flutter checks skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.exists == 'true'
        with:
          # Pinned to the version the app was created with; bump deliberately.
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - if: steps.detect.outputs.exists == 'true'
        run: flutter pub get

      - name: dart format
        if: steps.detect.outputs.exists == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze (infos are errors)
        if: steps.detect.outputs.exists == 'true'
        run: flutter analyze --fatal-infos

      - name: widget tests
        if: steps.detect.outputs.exists == 'true'
        run: flutter test --coverage

      - name: release web build
        if: steps.detect.outputs.exists == 'true'
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        if: always() && steps.detect.outputs.exists == 'true'
        with:
          name: flutter-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore
